name: docker-build
on: [push]
jobs:
  build:
    runs-on: gh-runnerd
    # No container: — docker/build-push-action needs Docker on the runner VM.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local/app:test
