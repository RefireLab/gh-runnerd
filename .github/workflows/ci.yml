name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet, test, build
        run: make ci
      - name: Linux binaries
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: gh-runnerd-linux
          path: dist/gh-runnerd*
