name: release

on:
  push:
    tags:
      - "v*"
  # Manual path: creates the tag from the current default-branch HEAD and
  # releases it in the same run. A tag pushed with GITHUB_TOKEN does not
  # re-trigger this workflow, which is exactly why goreleaser runs here too.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "tag must look like v0.6.0, got: $TAG" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "gh-runnerd $TAG"
          git push origin "refs/tags/$TAG"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
